# Weekly security and version updates (PCI DSS 6.3.3, docs/pci.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Runtime (render.yaml NODE_VERSION) and CI run Node 22, so @types/node
    # stays on 22.x; take its minors and patches, not new majors.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
