name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      # PCI DSS 6.3.3 (docs/pci.md): no known high or critical vulnerability
      # ships in a runtime dependency.
      - name: Dependency audit (runtime, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Type check (tsc --noEmit)
        run: npm run lint

      # WCAG 2.1 AA (docs/pci.md "Accessibility conformance"): jsx-a11y's
      # recommended rules on src/. The smoke job runs axe on the live pages.
      - name: Accessibility lint (eslint jsx-a11y)
        run: npm run lint:a11y

      - name: Unit tests (vitest)
        run: npm test

      # The partner API reference (docs/api/*.json) against the route table,
      # and the Opendate coverage table (docs/opendate-coverage.json) against
      # both: every Opendate endpoint accounted for, every Exos route it names
      # real and documented, docs/opendate-coverage.md current.
      - name: API reference (api-spec --check)
        run: node scripts/api-spec.mjs --check

      - name: Opendate coverage
        run: node scripts/check-opendate-coverage.mjs

      - name: Build (Vite)
        # Placeholder Supabase keys — the build succeeds without a live connection.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build

  edge-functions:
    name: Edge functions (deno check + Deno tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The edge functions are Deno and excluded from the Node tsconfig: the
    # parts shared with the app (_shared/marketplace, pricing, scrub) are
    # type-checked by `npm run lint`, but each function's index.ts only here.
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check every supabase/functions/*/index.ts
        # SKIP lists functions that can't type-check for environmental
        # reasons (name + why). None today: all of them check against their
        # real esm.sh imports. --node-modules-dir=none: the repo root's
        # package.json is the app's, not the functions'.
        run: |
          SKIP=""
          fail=0
          for f in supabase/functions/*/index.ts; do
            fn=$(basename "$(dirname "$f")")
            case " $SKIP " in *" $fn "*) echo "::notice::skipped $fn (see SKIP)"; continue;; esac
            echo "::group::$fn"
            deno check --node-modules-dir=none "$f" || { echo "::error::$fn does not type-check"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      - name: Deno tests (ssrf, ticket backends, sms, posh, group pages)
        # --allow-read: groupGate_test.ts reads exos-checkout's source to check the
        # group-pay-off gate comes before any DB claim or Stripe call.
        run: deno test --node-modules-dir=none --allow-read=supabase/functions/exos-checkout supabase/functions/_shared/ssrf_test.ts supabase/functions/_shared/backends/backends_test.ts supabase/functions/_shared/backends/luma_test.ts supabase/functions/_shared/channels/channels_test.ts supabase/functions/_shared/sms/sms_test.ts supabase/functions/_shared/posh/payload_test.ts supabase/functions/_shared/groupPages_test.ts supabase/functions/_shared/groupGate_test.ts

  smoke:
    name: Browser smoke (mocked Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # smoke.mjs, then a11y.mjs: axe (WCAG 2.0/2.1 A + AA) on the buyer path
      # and the Door app; serious or critical violations fail the job.
      - name: Smoke tests + accessibility gate (tests/smoke)
        run: npm run smoke

      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: tests/smoke/fail-*.png
          if-no-files-found: ignore

  exos-sql:
    name: Exos SQL (migrations + lifecycle)
    runs-on: ubuntu-24.04
    # 15: the race scripts add about a minute to the suites.
    timeout-minutes: 15
    # Applies the exos migrations to a throwaway Postgres and drives the real
    # RPC bodies: platform suite + ticket lifecycle (mint → roster → HMAC scan
    # → transfer/claim/reissue → void).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5433"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Exos platform suite (waitlist/addons/vouchers/tax/invoicing)
        run: bash tests/exos/run.sh exos_test

      - name: Exos ticket-lifecycle suite (mint/scan/transfer/void/reissue)
        run: bash tests/exos/run_lifecycle.sh exos_lifecycle_test

      - name: Exos audit-hardening suite (quota scope/transfer race/waitlist)
        run: bash tests/exos/run_audit_hardening.sh exos_audit_hardening_test

      - name: Exos money-path suite (refund ledger + void contracts)
        run: bash tests/exos/run_money_path.sh exos_money_test

      - name: Exos P0 suite (every exos migration in order, as prod was built; then the suites + replay)
        run: bash tests/exos/run_p0.sh exos_p0_test

      # Real parallel sessions against the run_p0 database. Only the race
      # scripts that hold one side's transaction open (pg_sleep) so the other
      # starts while it is uncommitted, and that passed 5 runs in a row
      # locally: money journal, journal payouts, group pay, org audit, and the
      # end-to-end races with the simulation's invariants. Each cleans up after
      # itself. The other race_*.sh stay by hand (see their headers).
      - name: Exos race scripts (journal, group pay, audit, end-to-end)
        run: |
          set -e
          for r in race_money_journal race_journal_payouts race_group_pay race_org_audit race_full; do
            echo "::group::$r"
            bash "tests/exos/$r.sh" exos_p0_test
            echo "::endgroup::"
          done

      - name: RLS security (barcode_secret least-privilege)
        # Moved from Terminal-2's supabase-rls workflow with the migrations
        # (2026-09-26). Builds the exos_tickets secret-visibility model, applies
        # the least-privilege migration, then asserts per org role that only
        # owner/buyer/scanner can read the secret.
        run: |
          psql -q -c "DROP DATABASE IF EXISTS exos_rls_test;" -c "CREATE DATABASE exos_rls_test;"
          psql -d exos_rls_test -v ON_ERROR_STOP=1 -f tests/exos/test_barcode_secret_rls.sql

      - name: Migration filenames carry "exos"
        # The DB is shared with Terminal-2: its prod drift check recognises
        # Exos-owned migrations by "exos" in the name, and both repos write the
        # same schema_migrations history. Keep every file here recognisable.
        run: |
          bad=$(ls supabase/migrations/*.sql | xargs -n1 basename | grep -vi exos || true)
          if [ -n "$bad" ]; then echo "::error::migration names must contain 'exos': $bad"; exit 1; fi

      - name: Every migration is applied (and each since 20260924215000 replayed) by run_p0.sh
        run: bash scripts/check-migrations.sh
